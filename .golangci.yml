version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - misspell
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: unused-parameter
        - name: receiver-naming
    gosec:
      excludes:
        # SARIF output and docs are meant to be readable: 0644 is intended.
        - G306
        # Reading files the user names on the command line is the job.
        - G304
  exclusions:
    generated: strict
    paths:
      - testdata
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rossedman/sarifix
