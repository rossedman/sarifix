# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sarifix

before:
  hooks:
    - go mod tidy
    - go run ./tools/gendocs
    - ./tools/release-extras.sh

builds:
  - id: sarifix
    main: ./cmd/sarifix
    binary: sarifix
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rossedman/sarifix/internal/version.Version={{ .Version }}
      - -X github.com/rossedman/sarifix/internal/version.Commit={{ .FullCommit }}
      - -X github.com/rossedman/sarifix/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sarifix
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

dockers_v2:
  - id: sarifix
    ids: [sarifix]
    images:
      - ghcr.io/rossedman/sarifix
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: sarifix
      org.opencontainers.image.description: Turn any SARIF scanner into a verified auto-fixer
      org.opencontainers.image.source: https://github.com/rossedman/sarifix
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
    sbom: true

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]

homebrew_casks:
  - name: sarifix
    ids: [sarifix]
    repository:
      owner: rossedman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Without the token (snapshots, forks) the cask is built but not pushed.
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}true{{ else }}auto{{ end }}'
    directory: Casks
    homepage: https://rossedman.io/sarifix/
    description: Turn any SARIF scanner into a verified auto-fixer
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "sarifix {{ .Tag }}"
    completions:
      bash: completions/sarifix.bash
      zsh: completions/sarifix.zsh
      fish: completions/sarifix.fish
    manpages:
      - manpages/sarifix.1.gz
    hooks:
      post:
        # The binary isn't notarized: without this, macOS refuses to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sarifix"]
          end

release:
  github:
    owner: rossedman
    name: sarifix
  extra_files:
    - glob: ./pkg/sarif/sarif-schema-2.1.0.json

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore\(deps\):'
      - '^build\(deps\):'
      - '^ci\(deps\):'
