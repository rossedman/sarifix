<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mint" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9cffda"/>
      <stop offset="0.45" stop-color="#3df5b5"/>
      <stop offset="1" stop-color="#1fb98a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="0.5" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e08a14"/>
    </linearGradient>
    <mask id="jaw" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <!-- the wrench's open end: a round seat and a slot toward the upper right -->
      <circle cx="140" cy="62" r="22" fill="#000"/>
      <rect x="127" y="-30" width="26" height="92" fill="#000" transform="rotate(45 140 62)"/>
    </mask>
  </defs>
  <g transform="translate(4 8) rotate(-5 100 100)">
    <!-- a wrench whose handle bends into a check mark -->
    <g mask="url(#jaw)">
      <path d="M30 104 L72 146 L132 72" fill="none" stroke="url(#mint)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="140" cy="62" r="42" fill="url(#mint)"/>
    </g>
    <!-- the finding, held in the jaw -->
    <circle cx="140" cy="62" r="15" fill="url(#amber)"/>
    <ellipse cx="135" cy="56" rx="5" ry="3.2" fill="#fff" opacity="0.55" transform="rotate(-35 135 56)"/>
  </g>
</svg>
