# Runs on every pull request: scans the PR and its merge base with the same
# config, then writes what the PR introduced to the job summary and uploads
# the report. Read-only: no secrets, no write token, no agent.
name: sarifix

on:
  pull_request:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # sarifix has no tagged release yet; pin a commit SHA from
      # github.com/rossedman/sarifix and bump it on purpose.
      SARIFIX_REF: main
      TRIVY_VERSION: v0.76.1
      CHECKOV_VERSION: "3.3.30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base must be reachable
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Install sarifix and checkov
        run: |
          go install "github.com/rossedman/sarifix/cmd/sarifix@${SARIFIX_REF}"
          pipx install "checkov==${CHECKOV_VERSION}"

      - name: Scan the merge base
        # The PR's sarifix.yaml scans both sides, so a config change in the
        # PR can't make the base look different.
        run: |
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          git worktree add "${RUNNER_TEMP}/base" "$base"
          sarifix scan --repo "${RUNNER_TEMP}/base" --config "${PWD}/sarifix.yaml" \
            --out-dir "${RUNNER_TEMP}/base-sarif" --log-level warn

      - name: Scan the pull request
        run: sarifix scan --out-dir "${RUNNER_TEMP}/head-sarif" --log-level warn

      - name: Report what the pull request introduced
        run: |
          sarifix fix --mode report \
            --sarif "${RUNNER_TEMP}/head-sarif/*.sarif" \
            --baseline "${RUNNER_TEMP}/base-sarif/*.sarif" \
            --out-dir "${RUNNER_TEMP}/report" --log-level warn
          sarifix diff --base "${RUNNER_TEMP}/base-sarif/*.sarif" \
            --head "${RUNNER_TEMP}/head-sarif/*.sarif" --json > "${RUNNER_TEMP}/report/diff.json"
          {
            echo "### sarifix"
            jq -r '.counts | "\(.new) new, \(.fixed) fixed, \(.unchanged) unchanged findings"' "${RUNNER_TEMP}/report/diff.json"
            echo
            jq -r '"Fixable now: \(.batched) findings in \(.batches | length) batches"' "${RUNNER_TEMP}/report/summary.json"
            echo
            echo "| New finding | Location |"
            echo "| --- | --- |"
            jq -r '.new[] | "| `\(.tool)/\(.ruleId)` | `\(.path):\(.startLine)` |"' "${RUNNER_TEMP}/report/diff.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarifix-report
          path: ${{ runner.temp }}/report/
